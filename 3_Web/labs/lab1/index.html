<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная №1</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем скрипт с атрибутом defer, чтобы он выполнялся после загрузки DOM -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Основная таблица-макет -->
    <table class="main-layout">
        <!-- Шапка сайта -->
        <tr class="header-row">
            <td colspan="2">
                <div class="header-inner">
                    <div class="header-left">
                        <h1>Ушаков Роман Павлович</h1>
                        <span class="header-group">Группа: P3213</span>
                    </div>
                    <div class="header-right">
                        <span class="header-variant">Вариант: 12708</span>
                    </div>
                </div>
            </td>
        </tr>

        <!-- Основной блок: Canvas и Форма -->
        <tr class="content-row">
            <!-- Левая колонка: Canvas -->
            <td class="canvas-cell">
                <canvas id="canvas" width="400" height="400"></canvas>
            </td>

            <!-- Правая колонка: Форма -->
            <td class="form-cell">
                <form id="coordinates-form">
                    <!-- Табличная верстка самой формы -->
                    <table class="form-table">
                        <tr>
                            <td>Введите X:</td>
                            <td class="radio-group">
                                <!-- Радиокнопки для X согласно заданию -->
                                <label><input type="radio" name="X" value="-5"> -5</label>
                                <label><input type="radio" name="X" value="-4"> -4</label>
                                <label><input type="radio" name="X" value="-3"> -3</label>
                                <label><input type="radio" name="X" value="-2"> -2</label>
                                <label><input type="radio" name="X" value="-1"> -1</label>
                                <label><input type="radio" name="X" value="0" checked> 0</label>
                                <label><input type="radio" name="X" value="1"> 1</label>
                                <label><input type="radio" name="X" value="2"> 2</label>
                                <label><input type="radio" name="X" value="3"> 3</label>
                            </td>
                        </tr>
                        <tr>
                            <td>Введите Y (от -5 до 5):</td>
                            <td>
                                <input type="text" id="Y" class="input-field" placeholder="Пример: 2" value="2">
                            </td>
                        </tr>
                        <tr>
                            <td>Введите R (от 1 до 4):</td>
                            <td>
                                <input type="text" id="R" class="input-field" placeholder="Пример: 3" value="3">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" class="submit-cell">
                                <button type="submit" class="submit-btn">Проверить точку</button>
                            </td>
                        </tr>
                    </table>
                    <!-- Блок для вывода ошибок валидации -->
                    <div id="error-message" class="error-message"></div>
                </form>
            </td>
        </tr>

        <!-- Блок результатов -->
        <tr class="result-row">
            <td colspan="2">
                <div class="result-wrapper">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>X</th>
                                <th>Y</th>
                                <th>R</th>
                                <th>Результат</th>
                                <th>Время проверки</th>
                            </tr>
                        </thead>
                        <tbody id="results-body"></tbody>
                    </table>
                    <button type="button" id="clear-history" class="clear-btn">Очистить историю</button>
                </div>
            </td>
        </tr>
    </table>

</body>

</html>
